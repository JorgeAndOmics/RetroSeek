# Generic end-to-end test config for RetroSeek - EXAMPLE VALUES ONLY.
#
# A full, schema-valid config for exercising the whole pipeline on your own
# data without touching the committed data/config/config.yaml. Usage:
#
#   1) mamba env create -f data/config/environment.yml          # once
#   2) cp tests/fixtures/example_test_config.yaml \
#         data/config/config.local.yaml                         # gitignored
#   3) Edit config.local.yaml - set the four `root` paths, `input.probe_csv`,
#      `execution.entrez_email`, and your real `species:` entries.
#   4) Run stages with --configfile, e.g.:
#        ./RetroSeek --probe-extractor     --configfile data/config/config.local.yaml
#        ./RetroSeek --ltr-candidates      --configfile data/config/config.local.yaml --cores 8
#        ./RetroSeek --ranges-analysis     --configfile data/config/config.local.yaml --cores 4
#        ./RetroSeek --solo-ltr-detection  --configfile data/config/config.local.yaml --cores 8
#
# Values below are illustrative; tune to your machine and dataset. Every field
# is documented in docs/configuration.md (or: RetroSeek --config-help [KEY]).

blast:
  e_value: 0.01
  optional_parameters: ''

genome_tools:
  suffix_array_parts: 10
  suffixerator_optional_parameters: ''
  ltrharvest_optional_parameters: ''
  ltrdigest_optional_parameters: ''

hotspot:
  input: catalog
  group_by: segment
  source: ltr-flanked
  window_size: 500000
  mask_size: 20
  mask_mismatch: 3
  pvalue_threshold: 0.05
  min_hits: 2
  merge_gap: 0
  strata_by_chromosome: true
  unplaced_min_factor: 10

parameters:
  seed: 67
  identity_threshold: 0
  bitscore_threshold: 50
  ltr_resize: 0
  ltr_flank_margin: 0
  merge_option: 'virus'
  probe_to_pair: 'ENV'
  pair_max_gap: 300000
  main_probes:
    - 'POL'
    - 'GAG'
    - 'ENV'
    - 'PRO'
  probe_min_length:
    GAG: 100
    POL: 100
    ENV: 100
    PRO: 100
  aggregation:
    virus: "list"
    label: "list"
    probe: "list"
    species: "first"
    best_tiebreaker: "bitscore"
    concat_separator: "; "
    strict_marker: "ambiguous"


# Native solo-LTR detection (ADR-017). A solo LTR is what a provirus leaves
# behind when its two LTRs recombine and excise everything between them. The
# detector uses the LTR arms of ERV-bearing elements as blastn bait, then
# subtracts the hits that are something else. Every threshold the method depends
# on lives here: the scripts take them as required arguments and carry no
# defaults of their own, so this file is the single source of truth.
solo_ltr:
  # Bait and hit must both be near-full-length LTRs. Without this the published
  # rules alone return a 492:1 solo/intact ratio, an order of magnitude too high,
  # because the coverage rule below assumes a full-length family consensus while
  # our bait is individual arms as short as 100 bp.
  min_bait_length: 300
  min_hit_length: 300
  min_identity: 95
  # Ou & Jiang's coverage window, as published: the alignment must span most of
  # the bait arm without running far past it.
  min_coverage: 0.8
  max_coverage: 1.2
  min_alignment_length: 80
  # A lone LTR this close to surviving retroviral coding sequence is a monoLTR at
  # an orphan, not a solo: the provirus is damaged, not excised.
  orphan_pad: 10000
  # Gap tolerated when merging overlapping blastn hits into one candidate locus.
  # 0 means only touching or overlapping hits merge.
  merge_gap: 0
  blast_task: dc-megablast
  blast_evalue: 1.0e-5
  max_target_seqs: 5000
  # Grid for the per-genome calibration plot, which shows how the solo/intact
  # ratio responds to the two thresholds that matter.
  calibration_lengths: [0, 300, 400, 500]
  calibration_identities: [70, 80, 85, 90, 95, 97, 99]
  tree:
    enable: true
    # Elements sampled as flanking-arm tips; both arms of a chosen element are
    # kept, which is what preserves the tree's positive control. Capped because
    # the clustering statistic compares against class abundance and saturates
    # when one class dominates: taking every arm made the Mus tree 96.5%
    # flanking, pushed the null to 0.94 and collapsed the enrichment to 1.03x.
    n_element_tips: 300
    # LTR families are cut from the tree as maximal clades whose largest
    # tip-to-tip distance is at most this (substitutions/site). 0.2 is the
    # 80-80-80 transposable-element family convention (80% identity), and it is
    # where family counts stop tracking the cut on the model 5; below ~0.1 the
    # tree shatters into pairs and "families" become an artefact.
    family_max_distance: 0.2
    # How many families of each kind (no intact member / with one) get their own
    # subtree page, largest by solo count.
    family_panels_per_kind: 3
    # Tips are all bait arms plus a sample of the other two classes, because a
    # tree over every solo would be neither computable nor readable.
    n_solo_tips: 200
    n_mono_tips: 200
    # Label permutations for the same-class-sister null.
    permutations: 20
    seed: 67
    model: GTR+G
    # IQ-TREE -fast: two iterations, no bootstrap. The tree is exploratory
    # evidence, never an input to classification.
    fast: true

plots:
  bitscore_x_scale: linear
  sankey_top_n: null
  sankey_other_label: 'Other'
  waffle_unit_hits: null
  circle_plot_bitscore_threshold: 0

execution:
  num_cores: 8
  use_species_dict: true
  retrieval_time_lag: 0.3
  max_retrieval_attempts: 3
  max_threadpool_workers: 4
  entrez_email: 'your.email@institution.example'

input:
  probe_csv: '/path/to/your/probes.csv'

display:
  # quiet | normal | verbose (ADR-021). Job logs are always complete.
  verbosity: normal

root:
  db_root_folder: '/path/to/your/genomes'
  data_root_folder: '/tmp/retroseek-test/data'
  results_root_folder: '/tmp/retroseek-test/results'
  logs_root_folder: '/tmp/retroseek-test/logs'

domains:
  POL:
    - "ase"
    - "RVT_1"
    - "RVT_2"
  GAG:
    - "Gag"
    - "gag"
    - "GAG"
    - "zf"
  ENV:
    - "coat"
    - "FP"
    - "HR1"
  PR15:
    - "PR15"

species:
  # key = genome FASTA stem in SPECIES_DB; value = display name.
  example_genome_1: "Example species one"
