# Every field is documented in docs/configuration.md
#   (or run `RetroSeek --config-help [KEY]` for a single field).
# Types / enums / ranges are enforced by data/config/schema.yaml.

blast:
  e_value: 0.01
  optional_parameters: ''

genome_tools:
  suffix_array_parts: 30
  suffixerator_optional_parameters: ''
  ltrharvest_optional_parameters: ''
  ltrdigest_optional_parameters: ''

hotspot:
  # catalog = one row per integration event (the assembled, non-overlapping
  # per-locus catalog); original = raw tBLASTn hits, denser but weighted by gene
  # content. Grouping and tier selection only apply to the catalog tier.
  input: catalog
  group_by: segment
  source: ltr-flanked
  window_size: 500000
  mask_size: 20
  mask_mismatch: 3
  pvalue_threshold: 0.05
  min_hits: 2
  merge_gap: 0
  strata_by_chromosome: true
  unplaced_min_factor: 10

parameters:
  seed: 67
  identity_threshold: 0
  bitscore_threshold: 0
  ltr_resize: 0
  ltr_flank_margin: 0
  merge_option: 'virus'
  probe_to_pair: 'ENV'
  pair_max_gap: 300000
  # ORDERED, and the order is read in two places that want different things:
  #   gene reliability - first = most reliable, wins the locus taxon call (POL)
  #   canonical gene order - canonical_order/is_canonical compare a locus's
  #                          genomic gene order against this list or its reverse
  # The retroviral genome is 5'-gag-pro-pol-env-3', so a POL-first list gives the
  # best taxon calls and reports canonical_order=false for a textbook provirus.
  # Order for whichever column you intend to read; see docs/configuration.md
  # ("How main_probes is used"). Loci with <=2 main genes are unaffected.
  main_probes:
    - 'POL'
    - 'GAG'
    - 'ENV'
    - 'PRO'
  probe_min_length:
    GAG: 200
    POL: 400
    ENV: 200
    VIF: 200
    N_protein: 200
  aggregation:
    virus: "best"
    label: "best"
    probe: "list"
    species: "first"
    best_tiebreaker: "bitscore"
    concat_separator: "; "
    strict_marker: "ambiguous"


# Native solo-LTR detection (ADR-017). A solo LTR is what a provirus leaves
# behind when its two LTRs recombine and excise everything between them. The
# detector uses the LTR arms of ERV-bearing elements as blastn bait, then
# subtracts the hits that are something else. Every threshold the method depends
# on lives here: the scripts take them as required arguments and carry no
# defaults of their own, so this file is the single source of truth.
solo_ltr:
  # Bait and hit must both be near-full-length LTRs. Without this the published
  # rules alone return a 492:1 solo/intact ratio, an order of magnitude too high,
  # because the coverage rule below assumes a full-length family consensus while
  # our bait is individual arms as short as 100 bp.
  min_bait_length: 300
  min_hit_length: 300
  min_identity: 95
  # Ou & Jiang's coverage window, as published: the alignment must span most of
  # the bait arm without running far past it.
  min_coverage: 0.8
  max_coverage: 1.2
  min_alignment_length: 80
  # A lone LTR this close to surviving retroviral coding sequence is a monoLTR at
  # an orphan, not a solo: the provirus is damaged, not excised.
  orphan_pad: 10000
  # Gap tolerated when merging overlapping blastn hits into one candidate locus.
  # 0 means only touching or overlapping hits merge.
  merge_gap: 0
  blast_task: dc-megablast
  blast_evalue: 1.0e-5
  max_target_seqs: 5000
  # Grid for the per-genome calibration plot, which shows how the solo/intact
  # ratio responds to the two thresholds that matter.
  calibration_lengths: [0, 300, 400, 500]
  calibration_identities: [70, 80, 85, 90, 95, 97, 99]
  tree:
    enable: true
    # Elements sampled as flanking-arm tips; both arms of a chosen element are
    # kept, which is what preserves the tree's positive control. Capped because
    # the clustering statistic compares against class abundance and saturates
    # when one class dominates: taking every arm made the Mus tree 96.5%
    # flanking, pushed the null to 0.94 and collapsed the enrichment to 1.03x.
    n_element_tips: 300
    # Tips are all bait arms plus a sample of the other two classes, because a
    # tree over every solo would be neither computable nor readable.
    n_solo_tips: 200
    n_mono_tips: 200
    # Label permutations for the same-class-sister null.
    permutations: 20
    seed: 67
    model: GTR+G
    # IQ-TREE -fast: two iterations, no bootstrap. The tree is exploratory
    # evidence, never an input to classification.
    fast: true

placement:
  # Colour scale for the per-genome heat-trees. 'absolute' keeps raw placement
  # mass, so a genome with more ERVs reads hotter; 'relative' normalises within
  # each sample, which is what you want when comparing genomes of very different
  # ERV load.
  mass_norm: absolute

classification:
  enable: true
  # Genes classified by phylogenetic placement onto a per-gene reference tree;
  # every other gene falls back to weighted-LCA. The builder reports mean
  # pairwise identity against a >=25% bar: POL 25.9% OK, GAG 19.7% LOW,
  # ENV 19.1% LOW (all-pairs medians: 23.2 / 16.7 / 16.2). GAG and ENV are
  # genuinely more divergent, so their trees are the weaker evidence - keep
  # them here only if their bootstrap support justifies it.
  placement_genes:
    - 'POL'
    - 'GAG'
    - 'ENV'
  search: blastx
  evalue: 0.001
  top_percent: 0.10
  min_orf: 30
  confidence_min: 0.5
  # Minimum gene completeness (fraction of main_probes present) for a locus to be
  # catalogued as a 'full' ERV in structure_class. 1.0 = every main gene present.
  # A single-main-gene locus is always 'gene'; anything present but below this
  # floor is 'partial'. Deliberately gene-content only - LTR-pair evidence lives
  # in the anchoring axis + the solo-LTR module, not here.
  structure_full_min: 1.0
  # Rank each taxon_call is rolled up to for the by-segment stage (any NCBI rank:
  # genus, subfamily, family). Calls coarser than this become unassigned_at_<rank>.
  segment_rank: 'genus'
  # Classification axis (ADR-008, rank-agnostic): the taxa - at ANY rank - the
  # reference is built at and that a locus can resolve to. Empty (or absent) derives
  # the axis from the distinct probeset Label values; set an explicit list to decouple
  # the classifier from the probeset (e.g. ['Lentivirus', 'Gammaretrovirus']).
  reference_taxa: []

logging:
  level_styles:
    debug: { color: 'white' }
    info: { color: 'cyan', bold: 'yes' }
    warning: { color: 'yellow' }
    error: { color: 'red', bold: 'yes' }
    critical: { color: 'black', bold: 'yes', background: 'red' }
  field_styles:
    asctime: { color: 'green' }
    hostname: { color: 'green' }
    levelname: { color: 'green' }
    name: { color: 'green' }
    programname: { color: 'green' }
    username: { color: 'green' }
    process: { color: 'green' }
    thread: { color: 'green' }

plots:
  # How many figures the --segment stage renders per taxonomic segment:
  #   full     every panel plot that means something for a single segment (28).
  #   curated  the small legacy subset (3): who carries it, how sure, what shape.
  #   none     per-segment tables only, no figures.
  # Cost scales as segments x plots, and each plot's x axis is per-species, so
  # drop to 'curated' if a high-genome-count run gets too slow or too bulky.
  segment_panel: full
  dpi: 300
  width: 15
  height: 12
  bitscore_x_scale: linear
  sankey_top_n: null
  sankey_other_label: 'Other'
  waffle_unit_hits: null
  circle_plot_bitscore_threshold: 0
  # Canvas growth for per-species panels: inches added per genome past the base
  # canvas, and the hard ceiling. Raise per_stratum if labels still crowd at your
  # genome count; max_dim guards the renderable-PNG limit (60in ~ 18000 px @300dpi).
  per_stratum: 0.18
  max_dim: 60

execution:
  num_cores: 64
  use_species_dict: true
  retrieval_time_lag: 0.3
  max_retrieval_attempts: 9
  max_threadpool_workers: null
  entrez_email: 'your.email@institution.example'

input:
  # Optional Newick of the host-species phylogeny, used to order and annotate the
  # species panels. Empty = no species tree (those plots render a placeholder).
  # Tip labels are matched to the `species:` display names below.
  species_tree: ''
  probe_csv: 'data/tables/probes.csv'
  # Curated Pfam domain class table: pfam_acc, pfam_name, class. Assigns each
  # Pfam family to one of retroviral_diagnostic / retroelement_shared / non_ltr /
  # dna_transposon / other, which is what decides domain_tier and domain_evidence.
  pfam_domain_classes: 'data/config/pfam_domain_classes.tsv'

display:
  display_snakemake_info: false
  display_requests_warning: false
  display_operation_info: true

root:
  db_root_folder: 'data/species'
  data_root_folder: 'data'
  results_root_folder: 'results'
  logs_root_folder: 'logs'

species:
  # key = genome FASTA stem in SPECIES_DB; value = display name.
  # Example values only - list your real genomes in config.local.yaml.
  example_genome_1: "Example species one"
  # example_genome_2: "Example species two"   # uncomment to add a genome
