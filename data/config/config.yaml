# Every field is documented in docs/configuration.md
#   (or run `RetroSeek --config-help [KEY]` for a single field).
# Types / enums / ranges are enforced by data/config/schema.yaml.

blast:
  e_value: 0.01
  optional_parameters: ''

genome_tools:
  suffix_array_parts: 30
  suffixerator_optional_parameters: ''
  ltrharvest_optional_parameters: ''
  ltrdigest_optional_parameters: ''

hotspot:
  # catalog = one row per integration event (the assembled, non-overlapping
  # per-locus catalog); original = raw tBLASTn hits, denser but weighted by gene
  # content. Grouping and tier selection only apply to the catalog tier.
  input: catalog
  group_by: segment
  source: ltr-flanked
  window_size: 500000
  mask_size: 20
  mask_mismatch: 3
  pvalue_threshold: 0.05
  min_hits: 2
  merge_gap: 0
  strata_by_chromosome: true
  unplaced_min_factor: 10

parameters:
  seed: 67
  identity_threshold: 0
  bitscore_threshold: 0
  ltr_resize: 0
  ltr_flank_margin: 0
  merge_option: 'virus'
  # How the per-hit domain flag (domain_hit_class) on LTR-flanked hits is decided:
  #   membership - a hit is 'substring_match' if its own gene has a config-matched
  #                Pfam domain anywhere in its enclosing LTR element (co-occurrence;
  #                cheap, the default). Values: substring_match / no_substring_match.
  #   positional - 'substring_match' only if the hit physically overlaps a
  #                config-matched domain of its gene; adds a 'non_domain' level for
  #                hits overlapping no domain (co-localization; stronger, opt-in).
  # Independent of the per-provirus domain_tier (which is always element-wise).
  hit_domain_mode: 'membership'
  probe_to_pair: 'ENV'
  pair_max_gap: 300000
  main_probes:
    - 'POL'
    - 'GAG'
    - 'ENV'
    - 'PRO'
  probe_min_length:
    GAG: 200
    POL: 400
    ENV: 200
    VIF: 200
    N_protein: 200
  aggregation:
    virus: "best"
    label: "best"
    probe: "list"
    species: "first"
    best_tiebreaker: "bitscore"
    concat_separator: "; "
    strict_marker: "ambiguous"
  solo_ltr_aggregation:
    probe: "list"
    best_tiebreaker: "consensus_members"

ltr_retriever:
  substitution_rate: 1.3e-8
  min_ltr_similarity: 91
  threads_per_genome: 4
  noanno: true
  source_scn: retroviral
  nearest_erv_max_distance: 10000

classification:
  enable: true
  placement_genes:
    - 'POL'
  search: blastx
  evalue: 0.001
  top_percent: 0.10
  min_orf: 30
  confidence_min: 0.5
  # Minimum gene completeness (fraction of main_probes present) for a locus to be
  # catalogued as a 'full' ERV in structure_class. 1.0 = every main gene present.
  # A single-main-gene locus is always 'gene'; anything present but below this
  # floor is 'partial'. Deliberately gene-content only - LTR-pair evidence lives
  # in the anchoring axis + the solo-LTR module, not here.
  structure_full_min: 1.0
  # Rank each taxon_call is rolled up to for the by-segment stage (any NCBI rank:
  # genus, subfamily, family). Calls coarser than this become unassigned_at_<rank>.
  segment_rank: 'genus'
  # Classification axis (ADR-008, rank-agnostic): the taxa - at ANY rank - the
  # reference is built at and that a locus can resolve to. Empty (or absent) derives
  # the axis from the distinct probeset Label values; set an explicit list to decouple
  # the classifier from the probeset (e.g. ['Lentivirus', 'Gammaretrovirus']).
  reference_taxa: []

logging:
  level_styles:
    debug: { color: 'white' }
    info: { color: 'cyan', bold: 'yes' }
    warning: { color: 'yellow' }
    error: { color: 'red', bold: 'yes' }
    critical: { color: 'black', bold: 'yes', background: 'red' }
  field_styles:
    asctime: { color: 'green' }
    hostname: { color: 'green' }
    levelname: { color: 'green' }
    name: { color: 'green' }
    programname: { color: 'green' }
    username: { color: 'green' }
    process: { color: 'green' }
    thread: { color: 'green' }

plots:
  dpi: 300
  width: 15
  height: 12
  bitscore_x_scale: linear
  sankey_top_n: null
  sankey_other_label: 'Other'
  waffle_unit_hits: null
  circle_plot_bitscore_threshold: 0
  # Canvas growth for per-species panels: inches added per genome past the base
  # canvas, and the hard ceiling. Raise per_stratum if labels still crowd at your
  # genome count; max_dim guards the renderable-PNG limit (60in ~ 18000 px @300dpi).
  per_stratum: 0.18
  max_dim: 60

execution:
  num_cores: 64
  use_species_dict: true
  retrieval_time_lag: 0.3
  max_retrieval_attempts: 9
  max_threadpool_workers: null
  entrez_email: 'your.email@institution.example'

input:
  # Optional Newick of the host-species phylogeny, used to order and annotate the
  # species panels. Empty = no species tree (those plots render a placeholder).
  # Tip labels are matched to the `species:` display names below.
  species_tree: ''
  probe_csv: 'data/tables/probes.csv'

display:
  display_snakemake_info: false
  display_requests_warning: false
  display_operation_info: true

root:
  db_root_folder: 'data/species'
  data_root_folder: 'data'
  results_root_folder: 'results'
  logs_root_folder: 'logs'

domains:
  POL:
    - "ase"
    - "RVT_1"
    - "RVT_2"
  GAG:
    - "Gag"
    - "gag"
    - "GAG"
    - "zf"
    - "PTAP"
    - "YPXL"
  ENV:
    - "coat"
    - "FP"
    - "HR1"
    - "HR2"
  PR15:
    - "PR15"

species:
  # key = genome FASTA stem in SPECIES_DB; value = display name.
  # Example values only - list your real genomes in config.local.yaml.
  example_genome_1: "Example species one"
  # example_genome_2: "Example species two"   # uncomment to add a genome
