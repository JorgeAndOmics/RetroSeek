blast: include('blast_schema')
genome_tools: include('genome_tools_schema')
hotspot: include('hotspot_schema', required=False)
parameters: include('parameters_schema')
solo_ltr: include('solo_ltr_schema', required=False)
placement: include('placement_schema', required=False)
classification: include('classification_schema', required=False)
plots: include('plots_schema')
execution: include('execution_schema')
input: include('input_schema')
display: include('display_schema')
root: include('root_schema')
species: include('species_schema')

---

blast_schema:
  e_value: num(min=0)
  optional_parameters: str(required=False)

genome_tools_schema:
  suffix_array_parts: int()
  suffixerator_optional_parameters: str(required=False)
  ltrharvest_optional_parameters: str(required=False)
  ltrdigest_optional_parameters: str(required=False)

hotspot_schema:
  input: str(matches='^(catalog|original)$')
  group_by: str(matches='^(segment|taxon_call|none)$', required=False)
  source: str(matches='^(ltr-flanked|orphan|both)$', required=False)
  window_size: int(min=1)
  mask_size: int(min=0)
  mask_mismatch: int(min=0)
  pvalue_threshold: num(min=0, max=1)
  min_hits: int(min=0)
  merge_gap: int(min=-1)
  strata_by_chromosome: bool()
  unplaced_min_factor: int(min=1)

parameters_schema:
  seed: int(min=0)
  identity_threshold: int(min=0)
  bitscore_threshold: num(min=0)
  ltr_resize: int(min=0)
  ltr_flank_margin: int(min=0)
  merge_option: str(matches='^(virus|label)$')
  probe_to_pair: str(required=False)
  pair_max_gap: num(min=0)
  main_probes: list(str())
  probe_min_length: map(int(min=0), key=str())
  aggregation: include('aggregation_schema', required=False)

aggregation_schema:
  virus: str(matches='^(list|concatenate|best|majority|first|strict)$')
  label: str(matches='^(list|concatenate|best|majority|first|strict)$')
  probe: str(matches='^(list|concatenate|best|majority|first|strict)$')
  species: str(matches='^(list|concatenate|best|majority|first|strict)$')
  best_tiebreaker: str(matches='^(bitscore|identity|align_length)$')
  concat_separator: str()
  strict_marker: str()

solo_ltr_schema:
  min_bait_length:       int(min=1)
  min_hit_length:        int(min=1)
  min_identity:          num(min=0, max=100)
  min_coverage:          num(min=0)
  max_coverage:          num(min=0)
  min_alignment_length:  int(min=1)
  orphan_pad:            int(min=0)
  merge_gap:             int(min=0)
  blast_task:            str(matches='^(blastn|megablast|dc-megablast|blastn-short)$')
  blast_evalue:          num(min=0)
  max_target_seqs:       int(min=1)
  blast_threads:         any(int(min=1), null(), required=False)
  calibration_lengths:   list(int(min=0))
  calibration_identities: list(num(min=0, max=100))
  tree:                  include('solo_ltr_tree_schema', required=False)

solo_ltr_tree_schema:
  enable:         bool()
  n_element_tips: int(min=0)
  family_max_distance: num(min=0)
  family_panels_per_kind: int(min=0)
  n_solo_tips:  int(min=0)
  n_mono_tips:  int(min=0)
  permutations: int(min=0)
  seed:         int(min=0)
  model:        str()
  fast:         bool()

placement_schema:
  mass_norm: str(matches='^(absolute|relative)$', required=False)

classification_schema:
  enable:          bool()
  placement_genes: list(str())
  search:          str(matches='^(blastx)$')
  evalue:          num(min=0)
  top_percent:     num(min=0, max=1)
  min_orf:         int(min=0)
  confidence_min:  num(min=0, max=1, required=False)
  structure_full_min: num(min=0, max=1, required=False)
  segment_rank: str(required=False)
  reference_taxa:  list(str(), required=False)


plots_schema:
  segment_panel: enum('full', 'curated', 'none', required=False)
  bitscore_x_scale: str(matches='^(linear|log10)$', required=False)
  sankey_top_n: any(int(min=1), null(), required=False)
  sankey_other_label: str(required=False)
  waffle_unit_hits: any(int(min=1), null(), required=False)
  circle_plot_bitscore_threshold: num(min=0)
  per_stratum: num(min=0, required=False)

execution_schema:
  num_cores: int(min=1)
  use_species_dict: bool()
  retrieval_time_lag: num(min=0)
  max_retrieval_attempts: int(min=1)
  max_threadpool_workers: any(int(min=1), null())
  entrez_email: str()

input_schema:
  probe_csv: str()
  species_tree: str(required=False)
  # Curated Pfam domain class table. Optional: defaults to
  # data/config/pfam_domain_classes.tsv.
  pfam_domain_classes: str(required=False)
  # Pfam release to download and record (ADR-019), e.g. '38.2'. Optional:
  # defaults to 38.2, the release the curated class table was checked against.
  pfam_release: str(matches='^[0-9]+\.[0-9]+$', required=False)

display_schema:
  # How much the terminal shows during a run (ADR-021). Job logs are always full.
  verbosity: enum('quiet', 'normal', 'verbose', required=False)

root_schema:
  db_root_folder: str()
  data_root_folder: str()
  results_root_folder: str()
  logs_root_folder: str()

species_schema: map(str(), key=str())
