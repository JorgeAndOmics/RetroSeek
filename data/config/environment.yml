# Source of truth for the RetroSeek dev + runtime environment.
#
# Discipline: every new `import` in workflow/scripts/*.py or tests/, and
# every new R `library(...)` in workflow/scripts/*.R or
# workflow/tests/testthat/*.R, must have its corresponding conda package
# added to this file in the SAME commit. Keep the section comments below
# accurate so contributors can find where a new dep belongs at a glance.
#
# Standard workflows:
#   make env         # first-time creation (calls mamba env create)
#   make env-update  # in-place sync after editing this file
#   conda activate RetroSeek
#   make check       # full lint + format-check + typecheck + tests

name: RetroSeek
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # -- runtime ----------------------------------------------
  # Python is pinned to 3.11 (lower bound for snakemake>=8). Source code
  # remains 3.10-syntax-compatible - ruff/mypy targets in pyproject.toml
  # are py310 so we don't accidentally adopt newer syntax that would
  # break someone running an older interpreter manually.
  - python=3.11
  - snakemake>=8
  - snakemake-wrapper-utils

  # -- external bio tools ----------------------------------
  # This pin used to be locked to rmblast=2.14.1. repeatmasker, pulled in by
  # ltr_retriever, depends on rmblast, which installs its OWN tblastn/blastn/
  # makeblastdb over blast's copies in the same bin/, so a mismatch meant
  # `conda list` said 2.16.0 while `tblastn -version` said 2.14.1. ADR-017 removed
  # ltr_retriever and with it repeatmasker and rmblast, so the lockstep is retired
  # and this pin can move on its own. Left at 2.14.1 deliberately: raising it is a
  # separate change needing `make env-update` and a rerun of the blast stages.
  - blast=2.14.1         # tblastn, blastn, makeblastdb
  - genometools-genometools  # gt ltrharvest, gt ltrdigest
  - ncbi-datasets-cli    # genome download via `datasets`
  - jq                   # genome_downloader.sh reads `datasets` JSON with it
  - hmmer                # hmmbuild/hmmalign - gene profiles + query alignment
  - mafft                # reference MSA + aligning query markers into it
  - iqtree               # per-gene reference tree (placement scaffold)
  - raxml-ng             # --evaluate: optimise the placement model/branch lengths
  - epa-ng               # phylogenetic placement of query markers onto the reference tree
  - gappa                # turn placements (.jplace) into taxonomic calls
                         #   blastx (from blast above) is the default translated search - no diamond.

  # -- python libs -----------------------------------------
  # biopython is version-pinned for reproducibility: the tBLASTn pickle cache
  # is only readable by the Biopython version that wrote it (older releases
  # exposed `Bio.Blast.Record`, which newer ones removed). Pinning keeps
  # `make env` deterministic; if you bump it, regenerate the cache (--blast).
  - biopython=1.87
  - pandas
  - pyarrow              # parquet I/O from Python
  - pandera
  - dill
  - tqdm
  # rich draws the launcher's screen (console.py only; ADR-021). Snakemake pulls it
  # in already; named here because the launcher imports it directly.
  - rich
  - pyyaml
  - yamale

  # -- R + data stack --------------------------------------
  - r-base=4.3
  - r-tidyverse
  - r-argparse
  - r-yaml
  - r-arrow              # parquet I/O from R
  - r-purrr
  - r-stringr
  - r-ggsci
  - r-ggnewscale
  - r-ggalluvial
  - r-ggdist
  - r-scales             # axis labellers; a ggplot2 dep but library()'d directly
  - r-waffle
  - r-patchwork          # multi-panel composition (hotspot summary panel)
  # The one figure font (docs/visual_style.md). Shipped inside the env so every
  # machine renders identical PDFs: systemfonts finds it in $CONDA_PREFIX/fonts
  # and cairo_pdf embeds it.
  - font-ttf-ibm-plex-sans
  # NB: MASS (glm.nb, used by the hotspot NB GLM) ships with r-base - no separate pin needed.

  # -- R Bioconductor --------------------------------------
  - bioconductor-biostrings
  - bioconductor-genomicranges
  - bioconductor-iranges     # core ranges infra; dep of genomicranges, library()'d directly
  - bioconductor-s4vectors   # core S4 infra; dep of genomicranges, library()'d directly
  - bioconductor-rtracklayer
  - bioconductor-plyranges
  - bioconductor-ggbio

  # -- dev / QA --------------------------------------------
  - pytest>=8
  - pytest-cov
  - pytest-mock
  - mypy>=1.15
  - ruff>=0.11
  - pre-commit>=4
  - r-lintr
  - r-styler
  - r-testthat
