# RetroSeek tooling config. Not a Python package manifest - this repo is a
# Snakemake workflow, not a library. Ruff, mypy, pytest, and coverage are
# configured here. Runtime dependencies live in data/config/environment.yml.

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["workflow/scripts", "tests"]
extend-exclude = [
    ".snakemake",
    "results",
    "data/pickles",
    "data/species",
    "data/tables",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific
    "A",      # flake8-builtins
    "DTZ",    # flake8-datetimez
    "LOG",    # flake8-logging
    "PT",     # flake8-pytest-style
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "ARG",    # flake8-unused-arguments
    "PL",     # Pylint
    "PERF",   # Perflint
    "D",      # pydocstyle, Google convention (below)
]
ignore = [
    "E501",    # line length handled by formatter
    "PLR0913", # too many arguments
    "PLR0917", # too many positional arguments: PLR0913's sibling, enforced under "PL" since ruff 0.16
    "PLR2004", # magic values in comparisons
    "D105",    # dunder methods: their behaviour is the protocol's, documented by Python
    "D107",    # __init__: Google style documents construction in the class docstring
]

[tool.ruff.lint.per-file-ignores]
# Test names state the behaviour under test, so tests need no docstrings; the
# docstring FORMAT rules still apply to the ones they have.
"tests/**/*.py" = ["ARG", "PLR2004", "D100", "D101", "D102", "D103", "D104"]
"workflow/tests/**/*.py" = ["D100", "D101", "D102", "D103", "D104"]
"workflow/Snakefile" = ["F821"]  # Snakemake-injected globals

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["retroseek"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_reexport = true
files = ["workflow/scripts"]
exclude = ['(^|/)tests/', '\.snakemake/', 'results/', 'data/']
enable_error_code = [
    "ignore-without-code",
    "redundant-cast",
    "truthy-bool",
]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# Third-party libs without stubs - keep overrides narrow.
[[tool.mypy.overrides]]
module = [
    "Bio.*",
    "pandas",
    "pyarrow.*",
    "pandera.*",
    "dill.*",
    "yaml",
    "yamale.*",
    "tqdm.*",
    "snakemake.*",
]
ignore_missing_imports = true

# tree_layout wraps Bio.Phylo, whose tree API ships no call signatures and whose
# Clade objects are extended with layout coordinates at runtime (the documented
# Bio.Phylo idiom). Both are inherent to using that library, not looseness in our
# code: every function here still carries full annotations, and only these two
# library-interface checks are relaxed.
[[tool.mypy.overrides]]
module = ["tree_layout", "placement_cophylogeny"]
disallow_untyped_calls = false
disable_error_code = ["attr-defined"]

[tool.pytest.ini_options]
testpaths = ["tests", "workflow/tests"]
pythonpath = ["workflow/scripts"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "-q",
]
markers = [
    "slow: deselect with '-m \"not slow\"'",
    "integration: requires external tools (blast, genometools)",
    "network: requires internet access (entrez, datasets)",
]

[tool.coverage.run]
source = ["workflow/scripts"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
# The floor only rises: 65% at the quality setup (2026-09-26), 68.85% after the
# campaign's characterization tests. `make test-py` enforces it; CI runs a
# faster subset without coverage.
fail_under = 68
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
